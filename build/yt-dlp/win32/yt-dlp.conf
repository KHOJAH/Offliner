# Suppress 90-day warning
--no-update

# Prioritize direct HTTPS/HTTP streams over HLS (m3u8)
--format-sort proto

# Enable JavaScript runtimes for YouTube challenge solving
--js-runtimes deno
--js-runtimes node

# YouTube client fallback priorities to prevent 403 Forbidden and avoid GVS PO token warnings
--extractor-args "youtube:player_client=web_embedded,web"
