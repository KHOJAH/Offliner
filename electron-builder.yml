appId: com.offliner.app
productName: Offliner
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - build/**/*
extraResources:
  - from: build/ffmpeg
    to: ffmpeg
    filter:
      - '**/*'
  - from: build/yt-dlp
    to: yt-dlp
    filter:
      - '**/*'
win:
  target: nsis
  icon: build/icon.png
mac:
  target: dmg
  icon: build/icon.icns
linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
publish:
  provider: github
  owner: KHOJAH
  repo: offliner
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
